openapi: 3.1.0
info:
  title: 'Smart Airline — M02 Flight Planning'
  version: '2026-10-18'
  description: 'Laravel/MySQL. Bearer token từ POST /api/v1/auth/login. Airport scope theo sân bay đi; ADMIN không bypass. Profile v1 ghi trong decisions, chưa được chứng nhận cho khai thác thật.'
servers:
  -
    url: /api/v1/core
security:
  -
    bearerAuth: {  }
paths:
  /routes:
    get:
      operationId: planningRoutes
      summary: 'Danh sách có filter/paging trong data.data'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
      parameters:
        -
          name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: status
          in: query
          required: false
          schema:
            enum:
              - ACTIVE
              - SUSPENDED
    post:
      operationId: planningRouteCreate
      summary: 'Tạo đường bay (route.write)'
      responses:
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
        201:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
  '/routes/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: planningRouteGet
      summary: 'Chi tiết đường bay (route.read)'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
