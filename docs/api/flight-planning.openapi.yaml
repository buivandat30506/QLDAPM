        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
    put:
      operationId: planningRouteUpdate
      summary: 'Sửa mùa/hạn chế; input một phần, expected_revision stale trả409'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteFields'
    delete:
      operationId: planningRouteDelete
      summary: 'Xóa khi chưa có lịch/chuyến; còn liên kết trả422'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
  /schedules:
    get:
      operationId: planningSchedules
      summary: 'Lọc lịch theo số hiệu, trạng thái, season_code; data.data'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
      parameters:
        -
          name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: status
          in: query
          required: false
          schema:
            enum:
              - DRAFT
              - PENDING
              - APPROVED
              - PUBLISHED
              - SUPERSEDED
              - CANCELLED
        -
          name: season_code
          in: query
          required: false
          schema:
            type: string
    post:
      operationId: planningScheduleCreate
      summary: 'Tạo DRAFT; nguồn lực/hiệu lực có thể bổ sung trước gửi duyệt'
      responses:
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
        201:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
  '/schedules/{id}':
    parameters:
      -
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: planningScheduleGet
      summary: 'Chi tiết và impacts; lịch sửa đổi là UUID mới'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
                type: object
        404:
          description: 'Không tìm thấy'
          content:
            application/json:
              schema:
                type: object
        422:
          description: 'Lỗi validation/nghiệp vụ; không chuyển trạng thái'
          content:
            application/json:
              schema:
                type: object
        409:
          description: 'Dữ liệu đã thay đổi; tải lại trước thao tác'
          content:
            application/json:
              schema:
                type: object
    put:
      operationId: planningScheduleUpdate
      summary: 'Sửa DRAFT; expected_revision stale trả409'
      responses:
        200:
          description: 'Thành công'
          content:
            application/json:
              schema:
                type: object
        401:
          description: 'Chưa xác thực'
          content:
            application/json:
              schema:
                type: object
        403:
          description: 'Thiếu quyền hoặc airport scope'
          content:
            application/json:
              schema:
