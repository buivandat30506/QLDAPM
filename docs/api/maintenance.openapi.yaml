            }
          },
          {
            "name": "action",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "authorize",
                "assign",
                "start",
                "task",
                "complete",
                "approve",
                "release",
                "keep-unavailable"
              ]
            }
          }
        ],
