    "/maintenance/materials/receipts": {
      "post": {
        "operationId": "maintenanceMaterialReceipt",
        "summary": "UC13: integer units; idempotent material/reference, conflicting replay rejected",
        "security": [
          {
            "sanctum": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted result under data; paginated collections use data.data"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Permission or airport scope denied"
          },
          "404": {
            "description": "Object not found"
          },
          "409": {
            "description": "Stale revision or legacy evidence requires adoption"
          },
