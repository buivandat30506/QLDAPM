    "/maintenance/orders/{order}/{action}": {
      "post": {
        "operationId": "maintenanceOrderAction",
        "summary": "UC13–14: authorize work before execution; assign invalidates authorization; start/stock, task, completion/signature, result approval, release/keep unavailable",
        "security": [
          {
            "sanctum": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted result under data; paginated collections use data.data"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
