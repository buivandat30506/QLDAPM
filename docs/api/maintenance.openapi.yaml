    },
    "/maintenance/orders/{order}/evidence": {
      "post": {
        "operationId": "maintenanceEvidenceUpload",
        "summary": "UC13: private PDF/PNG/JPEG, actual MIME checked, maximum 10 MiB",
        "security": [
          {
            "sanctum": []
          }
        ],
        "responses": {
          "201": {
            "description": "Persisted result under data; paginated collections use data.data"
          },
