  "components": {
    "securitySchemes": {
      "sanctum": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "PlanInput": {
        "type": "object",
        "required": [
          "plan_code",
          "aircraft_tail",
          "task",
          "trigger_type",
          "tasks",
          "reason",
          "starts_at_utc",
          "ends_at_utc",
          "due_at_utc"
        ],
        "properties": {
          "plan_code": {
            "type": "string",
            "maxLength": 50,
            "description": "Uppercase letters, digits, underscore or dash. LEGACY- is reserved for server-managed adoption."
          },
          "aircraft_tail": {
            "type": "string"
          },
          "task": {
            "type": "string",
            "maxLength": 200
          },
          "trigger_type": {
            "type": "string",
            "enum": [
              "DATE",
              "HOURS",
              "CYCLES",
              "CONDITION"
            ]
          },
          "tasks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "string",
              "maxLength": 200
            }
          },
          "reason": {
            "type": "string"
          },
          "due_hours": {
            "type": "string",
            "description": "Decimal total lifetime flight hours, required for HOURS"
          },
          "due_cycles": {
            "type": "integer",
            "minimum": 0
          },
          "condition": {
            "type": "string"
          },
          "condition_active": {
            "type": "boolean"
          },
          "resets_usage_basis": {
            "type": "boolean"
          },
          "expected_revision": {
            "type": "integer",
            "minimum": 1
          },
          "starts_at_utc": {
            "type": "string",
            "format": "date-time",
            "description": "UTC; explicit offset required for clients outside UTC"
          },
          "ends_at_utc": {
            "type": "string",
            "format": "date-time",
            "description": "UTC; explicit offset required for clients outside UTC"
          },
          "due_at_utc": {
            "type": "string",
            "format": "date-time",
            "description": "UTC; explicit offset required for clients outside UTC"
          }
        }
      },
      "OrderInput": {
        "type": "object",
        "required": [
          "order_code",
          "technician_id",
          "location_id"
        ],
        "properties": {
          "order_code": {
            "type": "string"
          },
          "technician_id": {
            "type": "string",
            "format": "uuid"
          },
          "location_id": {
            "type": "integer"
          },
          "materials": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "material_id",
                "quantity"
              ],
              "properties": {
                "material_id": {
                  "type": "integer"
                },
                "quantity": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          }
        }
      },
      "ActionInput": {
        "type": "object",
        "required": [
          "expected_revision",
          "reason"
        ],
        "properties": {
          "expected_revision": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string"
          },
          "task_id": {
            "type": "integer"
          },
          "result": {
            "type": "string"
          },
          "passed": {
            "type": "boolean"
          },
          "technical_confirmed": {
            "type": "boolean"
          },
          "technician_id": {
            "type": "string",
            "format": "uuid"
          },
          "location_id": {
            "type": "integer"
          },
          "materials": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "material_id",
                "quantity"
              ],
              "properties": {
                "material_id": {
                  "type": "integer"
                },
                "quantity": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          }
        }
      },
      "AdoptInput": {
        "type": "object",
        "required": [
          "technician_id",
          "location_id",
          "reason"
        ],
        "properties": {
          "technician_id": {
            "type": "string",
            "format": "uuid"
          },
          "location_id": {
            "type": "integer"
          },
          "reason": {
            "type": "string"
          }
        }
      }
    }
  }
}
