{
  "openapi": "3.0.3",
  "info": {
    "title": "M05 maintenance",
    "version": "1.0.0",
    "description": "Internal domain workflows are real. Numeric safety profiles are LOCAL_ONLY pending engineering approval. maintenance.read/write/approve are enforced with aircraft base airport scope; ADMIN has no bypass. Legacy text-only evidence cannot sign or release."
  },
  "servers": [
    {
      "url": "/api/v1/core"
    }
  ],
  "paths": {
    "/maintenance/plans": {
      "get": {
        "operationId": "maintenancePlans",
        "summary": "UC12: scoped search q/status and pagination",
        "security": [
          {
            "sanctum": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted result under data; paginated collections use data.data"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Permission or airport scope denied"
          },
          "404": {
            "description": "Object not found"
          },
          "409": {
            "description": "Stale revision or legacy evidence requires adoption"
          },
          "422": {
            "description": "Business validation failure; no partial mutation"
          }
        },
        "parameters": []
      },
      "post": {
        "operationId": "maintenancePlanCreate",
        "summary": "UC12: plan date/hours/cycles/condition; usage reconciliation and conflict check",
        "security": [
