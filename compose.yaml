name: airline-smart-local
x-application: &application
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: airline-smart:local
  environment: &environment
    APP_ENV: local
    APP_DEBUG: "false"
    APP_KEY: ${AIRLINE_APP_KEY:?Run php scripts/create-compose-env.php first}
    APP_URL: http://localhost:8080
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: airline_local
    DB_USERNAME: airline
    DB_PASSWORD: ${AIRLINE_DB_PASSWORD:?Missing private compose environment}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
  volumes:
    - app-storage:/var/www/app/storage
  restart: unless-stopped
  stop_grace_period: 45s

services:
  db:
    image: mysql:8.0.46
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: airline_local
      MYSQL_USER: airline
      MYSQL_PASSWORD: ${AIRLINE_DB_PASSWORD:?Missing private compose environment}
      MYSQL_ROOT_PASSWORD: ${AIRLINE_DB_ROOT_PASSWORD:?Missing private compose environment}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --user=airline --database=airline_local --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  init:
    <<: *application
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --class=AccessControlSeeder --force && php artisan schedule:run"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    <<: *application
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
  worker:
    <<: *application
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=30", "--max-time=3600"]
    depends_on:
      init:
        condition: service_completed_successfully
  scheduler:
    <<: *application
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  app-storage:
