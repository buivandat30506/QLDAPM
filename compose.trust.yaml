# Optional custom CA bundle, explicitly selected by scripts/demo.py.
services:
  app:
    volumes:
      - ${AIRLINE_CA_BUNDLE:?Set a readable CA bundle}:/run/airline/ca-bundle.pem:ro
    environment:
      PAYMENTS_CA_BUNDLE: /run/airline/ca-bundle.pem
      SSL_CERT_FILE: /run/airline/ca-bundle.pem
      COMPOSER_CAFILE: /run/airline/ca-bundle.pem
  worker:
    volumes:
      - ${AIRLINE_CA_BUNDLE:?Set a readable CA bundle}:/run/airline/ca-bundle.pem:ro
    environment:
      PAYMENTS_CA_BUNDLE: /run/airline/ca-bundle.pem
      SSL_CERT_FILE: /run/airline/ca-bundle.pem
  mail-worker:
    volumes:
      - ${AIRLINE_CA_BUNDLE:?Set a readable CA bundle}:/run/airline/ca-bundle.pem:ro
    environment:
      PAYMENTS_CA_BUNDLE: /run/airline/ca-bundle.pem
      SSL_CERT_FILE: /run/airline/ca-bundle.pem
